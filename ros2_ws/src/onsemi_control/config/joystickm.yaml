joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.2
    autorepeat_rate: 50.0

teleop_node:
  ros__parameters:
    axis_linear:
      x: 1
      y: 0
    scale_linear:
      x: 0.3
      y: 0.4
    scale_linear_turbo:
      x: 1.4
      y: 1.4

    axis_angular:
      yaw: 2
    scale_angular:
      yaw: 0.4
    scale_angular_turbo:
      yaw: 1.4

    enable_button: 6
    enable_turbo_button: 7

    require_enable_button: true
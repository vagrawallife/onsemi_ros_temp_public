controller_manager:
  ros__parameters:
    update_rate: 30    

    diff_cont:
      type: diff_drive_controller/DiffDriveController

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_cont:
  ros__parameters:    
    frame_id: odom    
    child_frame_id: body_link
    right_wheel_names: ['front_right_wheel_link' , 'rear_right_wheel_link']
    left_wheel_names: ['front_left_wheel_link' , 'rear_left_wheel_link']    
    wheel_separation: 0.59
    wheel_radius: 0.0762
    publish_rate: 20.0
    
    pose_covariance_diagonal : [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    open_loop: true
    enable_odom_tf: true
    use_stamped_vel: false
    cmd_vel_timeout: 0.5
    wheels_per_side: 2    

